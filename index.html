<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#3b0917" />
  <meta name="description" content="نموذج الماستر كوتش: محمد الغامدي للكوتشنج الطلابي" />
  <meta name="application-name" content="الماستر كوتش" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="الماستر كوتش" />
  <title>نموذج الماستر كوتش: محمد الغامدي</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar glass">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="brand">
        <div class="crown">♛</div>
        <h1>نموذج الماستر كوتش: محمد الغامدي</h1>
        <div class="subtitle">للكوتشنج الطلابي</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn install-mini" id="installBtn" title="تثبيت التطبيق" aria-label="تثبيت التطبيق">⇩</button>
        <button class="icon-btn reset-mini" id="resetBtn" title="إعادة ضبط التقدم" aria-label="إعادة ضبط التقدم">↻</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav glass" aria-label="التنقل الرئيسي">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-route="stages" class="nav-item"><span>◉</span><small>المراحل</small></button>
      <button data-route="progress" class="nav-item"><span>▥</span><small>متابعة تقدمي</small></button>
      <button data-route="resources" class="nav-item"><span>▤</span><small>مكتبة الموارد</small></button>
      <button data-route="profile" class="nav-item"><span>●</span><small>ملفي</small></button>
    </nav>
  </div>

  <template id="homeTemplate">
    <section class="hero glass">
      <div class="hero-copy">
        <span class="eyebrow">من الطموح إلى الفعل</span>
        <h2>رحلتك تبدأ من هنا</h2>
        <p>بخمس خطوات عملية تساعدك على صناعة مستقبل أكثر وضوحًا.</p>
        <div class="hero-actions">
          <button class="primary-btn" data-action="start">ابدأ الرحلة ▶</button>
          <button class="secondary-btn" data-route-jump="stages">استكشف النموذج</button>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="road"></div>
        <div class="sun"></div>
        <div class="student">🎓</div>
      </div>
    </section>

    <section class="summary-grid">
      <article class="glass metric-card">
        <div class="metric-title">معدل الإنجاز</div>
        <div class="ring" id="homeRing"><span id="homePercent">٠٪</span></div>
      </article>
      <article class="glass quote-card">
        <div class="quote-mark">“</div>
        <p>كل خطوة صغيرة اليوم تصنع فرقًا كبيرًا في مستقبلك غدًا.</p>
      </article>
    </section>

    <section class="install-card glass" id="installCard">
      <div class="install-card-icon">⬇</div>
      <div class="install-card-copy">
        <span class="eyebrow">استخدمه كتطبيق مستقل</span>
        <h3>ثبّت نموذج الماستر كوتش على جهازك</h3>
        <p>وصول أسرع من الشاشة الرئيسية، وتجربة مستقلة، مع استمرار عمل الأجزاء الأساسية دون اتصال بعد فتحها أول مرة.</p>
      </div>
      <button class="primary-btn" id="homeInstallBtn">تثبيت التطبيق</button>
    </section>

    <section class="section-block">
      <div class="section-head">
        <h3>المراحل الخمس</h3>
        <span class="muted">اضغط على أي مرحلة للبدء</span>
      </div>
      <div class="stage-cards" id="homeStages"></div>
    </section>

    <section class="glass about-card">
      <h3>عن النموذج</h3>
      <p>نموذج عملي يساعد الطالب على تحديد أهدافه، واكتشاف اهتماماته وشغفه، وربطها بواقعه، ثم وضع خطة واضحة والالتزام بالتنفيذ والمتابعة.</p>
    </section>
  </template>

  <template id="stagesTemplate">
    <section class="section-block">
      <div class="section-head">
        <div>
          <span class="eyebrow">خمس خطوات تصنع مستقبلك</span>
          <h2>اختر المرحلة</h2>
        </div>
        <div class="mini-progress"><span id="stagesPercent">٠٪</span></div>
      </div>
      <div class="stage-list" id="stageList"></div>
    </section>
  </template>

  <template id="stageDetailTemplate">
    <section class="stage-detail">
      <div class="glass detail-head" id="detailHead">
        <button class="back-btn" data-route-jump="stages">→ رجوع</button>
        <div class="detail-title-wrap">
          <div class="stage-icon big" id="detailIcon"></div>
          <div>
            <div class="eyebrow" id="detailStep"></div>
            <h2 id="detailTitle"></h2>
            <p id="detailSubtitle"></p>
          </div>
        </div>
        <div class="step-progress" id="detailProgress"></div>
      </div>

      <form class="glass coaching-form" id="coachingForm">
        <div id="questionFields"></div>

        <div class="output-panel" id="outputPanel">
          <span class="tag">المخرج</span>
          <strong id="outputText"></strong>
        </div>

        <label class="field-block">
          <span>ملاحظات إضافية</span>
          <textarea id="notes" rows="3" placeholder="اكتب أي ملاحظات أو أفكار إضافية..."></textarea>
        </label>

        <div class="form-actions">
          <button type="button" class="secondary-btn" id="prevStage">السابق</button>
          <button type="submit" class="primary-btn">حفظ</button>
          <button type="button" class="primary-btn alt" id="nextStage">التالي</button>
        </div>
      </form>
    </section>
  </template>

  <template id="progressTemplate">
    <section class="section-block">
      <div class="section-head">
        <div>
          <span class="eyebrow">رحلة نحو مستقبل أكثر وضوحًا</span>
          <h2>متابعة تقدمي</h2>
        </div>
      </div>

      <section class="progress-layout">
        <article class="glass big-progress-card">
          <div class="big-ring" id="progressRing"><span id="progressPercent">٠٪</span></div>
          <div>
            <h3>معدل الإنجاز</h3>
            <p class="muted" id="progressMessage">ابدأ الآن، ومستقبلك ينتظرك.</p>
          </div>
        </article>

        <article class="glass">
          <div class="section-head compact"><h3>حالة المراحل الخمس</h3></div>
          <div id="progressStages" class="progress-stages"></div>
        </article>
      </section>

      <section class="glass checklist-card">
        <div class="section-head compact"><h3>خطة هذا الأسبوع</h3><button class="small-btn" id="clearChecklist">إلغاء التحديد</button></div>
        <div id="weeklyChecklist"></div>
      </section>

      <section class="glass achievements">
        <div class="section-head compact"><h3>شاراتي وإنجازاتي</h3></div>
        <div id="badges" class="badge-grid"></div>
      </section>
    </section>
  </template>

  <template id="resourcesTemplate">
    <section class="section-block resources-page">
      <div class="section-head resources-head">
        <div>
          <span class="eyebrow">أدلة • قوالب • ملفات • روابط</span>
          <h2>مكتبة الموارد</h2>
          <p class="muted resource-note">الملفات التي تضيفها من داخل التطبيق تُحفظ على هذا الجهاز فقط. أما الموارد الموجودة داخل المستودع فتظهر لجميع المستخدمين.</p>
        </div>
        <button class="primary-btn" id="addResourceBtn">＋ إضافة مورد</button>
      </div>

      <section class="glass resource-toolbar">
        <label class="search-box">
          <span>⌕</span>
          <input id="resourceSearch" type="search" placeholder="ابحث باسم المورد أو وصفه..." />
        </label>
        <div class="resource-filters" id="resourceFilters"></div>
      </section>

      <div id="resourceStats" class="resource-stats"></div>
      <div id="resourceGrid" class="resource-grid"></div>
      <div id="resourceEmpty" class="glass resource-empty" hidden>
        <div>📚</div>
        <h3>لا توجد موارد مطابقة</h3>
        <p>غيّر البحث أو أضف موردًا جديدًا.</p>
      </div>
    </section>
  </template>

  <template id="simpleTemplate">
    <section class="section-block">
      <article class="glass empty-card">
        <div class="empty-icon" id="simpleIcon"></div>
        <h2 id="simpleTitle"></h2>
        <p id="simpleText"></p>
      </article>
    </section>
  </template>

  <dialog id="resourceDialog" class="app-dialog">
    <form method="dialog" class="dialog-card glass" id="resourceForm">
      <div class="dialog-head">
        <div><span class="eyebrow">مورد جديد</span><h3>إضافة مورد إلى المكتبة</h3></div>
        <button type="button" class="dialog-close" data-close-dialog="resourceDialog" aria-label="إغلاق">×</button>
      </div>
      <div class="resource-mode" role="tablist" aria-label="نوع المورد">
        <button type="button" class="mode-btn active" data-resource-mode="file">📎 ملف</button>
        <button type="button" class="mode-btn" data-resource-mode="link">🔗 رابط</button>
      </div>
      <input type="hidden" id="resourceMode" value="file" />
      <label class="field-block"><span>عنوان المورد</span><input id="resourceTitle" required maxlength="120" placeholder="مثال: نموذج صياغة الهدف الذكي" /></label>
      <label class="field-block"><span>المرحلة / التصنيف</span>
        <select id="resourceCategory">
          <option value="عام">عام</option><option value="أطمح">أطمح</option><option value="أهتم">أهتم</option><option value="أربط">أربط</option><option value="أخطط">أخطط</option><option value="أنفذ">أنفذ</option>
        </select>
      </label>
      <label class="field-block"><span>وصف مختصر</span><textarea id="resourceDescription" rows="2" placeholder="ما فائدة هذا المورد؟"></textarea></label>
      <label class="field-block resource-file-field" id="resourceFileField"><span>اختر الملف</span><input id="resourceFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.rtf,.csv,.png,.jpg,.jpeg,.webp,.gif,.mp4,.mov,.m4v,.zip" /></label>
      <label class="field-block resource-link-field" id="resourceLinkField" hidden><span>رابط المورد</span><input id="resourceUrl" type="url" inputmode="url" placeholder="https://example.com/resource" /></label>
      <div class="dialog-hint">🔒 الملفات المرفوعة هنا تبقى داخل متصفح هذا الجهاز ولا تُرفع تلقائيًا إلى GitHub.</div>
      <div class="dialog-actions"><button type="button" class="secondary-btn" data-close-dialog="resourceDialog">إلغاء</button><button type="submit" class="primary-btn">حفظ المورد</button></div>
    </form>
  </dialog>

  <dialog id="installDialog" class="app-dialog">
    <section class="dialog-card glass">
      <div class="dialog-head">
        <div><span class="eyebrow">تثبيت التطبيق</span><h3>أضف التطبيق إلى جهازك</h3></div>
        <button type="button" class="dialog-close" data-close-dialog="installDialog" aria-label="إغلاق">×</button>
      </div>
      <div id="installInstructions" class="install-instructions"></div>
      <div class="dialog-actions"><button type="button" class="primary-btn" data-close-dialog="installDialog">حسنًا</button></div>
    </section>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
