<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورقة جلسة الكوتشنج الطلابي</title><style>body{font-family:Tahoma,Arial;background:#f6efe7;color:#2d1612;margin:0;padding:30px}.sheet{max-width:850px;margin:auto;background:#fff;border:2px solid #8b1f38;border-radius:22px;padding:28px}h1{color:#6c1428}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #d7c0a2;border-radius:14px;padding:15px;min-height:90px}.wide{grid-column:1/-1}.line{border-bottom:1px dashed #9f8060;height:30px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="sheet"><h1>ورقة جلسة الكوتشنج الطلابي</h1><p>نموذج الماستر كوتش: محمد الغامدي</p><div class="grid"><div class="box"><b>اسم المستفيد</b><div class="line"></div></div><div class="box"><b>تاريخ الجلسة</b><div class="line"></div></div><div class="box wide"><b>موضوع الجلسة / الهدف</b><div class="line"></div><div class="line"></div></div><div class="box wide"><b>أبرز الأسئلة والاكتشافات</b><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="box wide"><b>الخطوة العملية التالية</b><div class="line"></div><div class="line"></div></div><div class="box"><b>موعد المتابعة</b><div class="line"></div></div><div class="box"><b>مؤشر النجاح</b><div class="line"></div></div></div></main></body></html>
